name: Update OVO Hydro calendar

on:
  schedule:
    - cron: "17 5 * * *"

  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - "scrape_hydro.py"
      - "requirements.txt"
      - ".github/workflows/update-calendar.yml"

permissions:
  contents: write

concurrency:
  group: ovo-hydro-calendar-update
  cancel-in-progress: false

env:
  PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.playwright-browsers

jobs:
  update-calendar:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies and Chromium
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium
          python -m playwright install --list

      - name: Generate calendar
        run: python scrape_hydro.py

      - name: Commit updated calendar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add docs/ovo-hydro.ics docs/events.json

          if git diff --cached --quiet; then
            echo "No calendar changes detected."
          else
            git commit -m "Update OVO Hydro events"
            git push
          fi
